before_script:
   - npm config set //registry.npmjs.org/:_authToken ${NPM_TOKEN}
   - npm install

.build_template: &build_definition
  script:
   - npx lerna bootstrap
   - cd projects/libraries/core && echo Running tests for core && npm run test
   - cd projects/libraries/scxml && echo Running tests for scxml && npm run test

build:node:12.12.0:
  image: node:12.12.0
  <<: *build_definition

build:node:14.12.0:
  image: node:14.12.0
  <<: *build_definition

