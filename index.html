<html>
  <head>
    <link href="index.css" rel="stylesheet">
  </head>
  <body>
    <div class="app">
    </div>
    <script>
      const path = require('path');
      Promise.all(
        [
          path.join(path.dirname(require.resolve('toastr')), 'build/toastr.css'),
          path.join(path.dirname(path.dirname(require.resolve('@jbeard/schviz2'))), 'test-integration/styles.css')
        ].map(function(pathToStyle){
          let link = document.createElement('link');
          link.setAttribute('rel','stylesheet');
          link.setAttribute('href',pathToStyle);
          document.head.appendChild(link);
          let promise = new Promise(function(resolve, reject){
            link.addEventListener('load',function(e){
              resolve();
            });
          });
          return promise;
        })
      ).then(function(){
        require('babel-polyfill');
        require('./dist/scxml-tool.js');
      });
    </script>
  </body>
</html>
