<!doctype html>
<html>
  <head>
    <script src="bower_components/jquery/dist/jquery.js"></script>
    <script src="bower_components/Snap.svg/dist/snap.svg.js"></script>
    <script src="bower_components/klayjs/klay.js"></script>
    <style type="text/css">
      html, body { height : 100%; width : 100%; margin : 0; }

      #content {
        margin-top: 5px;
      }
      
      dl {
        margin-bottom: 5px;
      }
      
      g.leaf > rect {
        stroke: #fff;
        stroke-width: 1px;
        opacity: .5;
      }
      
      g.leaf > text {
        fill: #ffffff;
      }
    
      g.compound > rect {
        opacity: 0.1;
      }
      
      .node {
      }
      
      .link {
        stroke: #999;
        stroke-opacity: .6;
        fill: none;
        marker-end : url(#end);
      }
      
      .port {
        stroke: #000;
        width: 1px;
        opacity: .6;
      }
    </style>
  </head>
  <body>
    <svg id="svg" width="100%" height="100%">
      <defs><marker id="end" viewBox="0 -5 10 10" refX="10" refY="0" markerWidth="3" markerHeight="5" orient="auto" style="fill: rgb(153, 153, 153); stroke-opacity: 0.6;"><path d="M0,-5L10,0L0,5"></path></marker></defs>
    </svg>      
    <script src="index.js"></script>
  </body>
</html>
