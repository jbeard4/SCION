<!doctype html>
<html>
  <head>
    <script src="bower_components/pathseg/pathseg.js"></script>
    <script src="bower_components/jquery/dist/jquery.js"></script>
    <script src="bower_components/Snap.svg/dist/snap.svg.js"></script>
    <script src="bower_components/klayjs/klay.js"></script>
    <style type="text/css">
      html, body { height : 100%; width : 100%; margin : 0; }

      #content {
        margin-top: 5px;
      }
      
      dl {
        margin-bottom: 5px;
      }
      
      g.leaf > rect {
        fill: rgba(0,0,0,.5);
      }
      
      g.leaf > text {
        fill: #ffffff;
      }
    
      g.compound.parallel > g.node > rect {
        stroke-dasharray : 1 1;
      } 

      .node > rect {
        fill: rgba(0,0,0,.1);
        stroke: #AAA;
      }
      
      .node rect:hover {
        stroke : yellow;
      }

      .node.selected > rect {
        stroke : blue;
      }
      
      .link {
        stroke: black;
        stroke-opacity: .6;
        fill: none;
        marker-end : url(#end);
      }

      .link:hover {
        stroke : yellow;
      }
      
      .port {
        stroke: #000;
        width: 1px;
        opacity: .6;
      }

      #end path {
        stroke: black;
        stroke-opacity: .6;
      }

    </style>
  </head>
  <body>
    <select id="select-example"></select>
    <select id="select-layout"></select>
    <svg id="svg" width="100%" height="100%">
      <defs><marker id="end" viewBox="0 -5 10 10" refX="10" refY="0" markerWidth="3" markerHeight="5" orient="auto"><path d="M0,-5L10,0L0,5"></path></marker></defs>
    </svg>      
    <script src="index.js"></script>
  </body>
</html>
