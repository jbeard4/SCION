<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
  <link rel="shortcut icon" type="image/ico" href="favicon.ico" />
  <title>Event Log</title>
  <link rel="stylesheet" href="./node_modules/slickgrid/slick.grid.css" type="text/css"/>
  <link rel="stylesheet" href="./node_modules/slickgrid/slick-default-theme.css" type="text/css"/>
  <link href="node_modules/@jbeard/schviz2/test-integration/styles.css" rel="stylesheet"/>
  <link href="node_modules/jsoneditor/dist/jsoneditor.min.css" rel="stylesheet"/>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background-color: White;
      overflow: auto;
    }
    body {
      font: 11px Helvetica, Arial, sans-serif;
    }
    #schvizContainer {
      position: absolute;
      top: 0%;
      left: 0;
      right: 0;
      bottom: 50%;
    }
    #tableContainer {
      position: absolute;
      top: 50%;
      left: 0;
      right: 50%;
      bottom: 0;
    }
    #infoContainer {
      position: absolute;
      top: 50%;
      left: 50%;
      right: 0%;
      bottom: 0;
    }
    #description {
      position: fixed;
      top: 30px;
      right: 30px;
      width: 25em;
      background: beige;
      border: solid 1px gray;
      z-index: 1000;
    }
    #description h2 {
      padding-left: 0.5em;
    }
    #title {
      position:absolute;
      margin:.25em;
    }
  </style>
</head>
<body>
<div id="schvizContainer"></div>
<h1 id="title"><span id="scxmlName"></span> [<span id="sessionId"></span>]</h1>
<div id="tableContainer"></div>
<div id="infoContainer"></div>

<script src="./node_modules/react/dist/react.js"></script>
<script src="./node_modules/react-dom/dist/react-dom.js"></script>
<script src="./node_modules/slickgrid/lib/jquery-1.11.2.min.js"></script>
<script src="./node_modules/slickgrid/lib/jquery.event.drag-2.3.0.js"></script>

<script src="node_modules/babel-polyfill/dist/polyfill.js"></script>
<script src="./node_modules/@jbeard/scxml/dist/scxml.js"></script>
<script src="./node_modules/@jbeard/schviz2/dist/schviz.js"></script>
<script src="./node_modules/slickgrid/slick.core.js"></script>
<script src="./node_modules/slickgrid/slick.grid.js"></script>
<script src="./node_modules/slickgrid/slick.dataview.js"></script>
<script src="./node_modules/slickgrid/plugins/slick.rowselectionmodel.js"></script>
<script src="./node_modules/jsoneditor/dist/jsoneditor.min.js"></script>
<script src="./index.js"></script>
</body>
</html>
