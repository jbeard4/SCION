<div>
  <div>
    <form class="form-horizontal">
      <div class="form-group">
        <label class="col-sm-2 control-label">Example</label>
        <div class="col-sm-10">
          <select class="form-control" id="select-example" ng-model="$ctrl.testUrl" ng-options="val for val in $ctrl.allTests"></select>
        </div>
      </div>
      <div class="form-group">
        <label for="inputPassword" class="col-sm-2 control-label">Layout</label>
        <div class="col-sm-10">
          <select class="form-control" id="select-layout" ng-model="$ctrl.layout" ng-options="k for (k, v) in $ctrl.klayOptions"></select>
        </div>
      </div>
    </form>
  </div>

  <div style="width:100%; height:100%">
    <schviz model-url="$ctrl.testUrl" layout="$ctrl.layout"/>
  </div>
</div>
